<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ДОМИННО — 3D-конфигуратор</title>
    <meta name="description" content="3D-конфигуратор каркасных префаб-домов ДОМИННО: барнхаусы dominno130 и dominno240. Комплектация, фасад, кровля, окна — с ценами dominno.ru." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="src/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.min.js",
          "three/addons/": "./vendor/three/addons/",
          "three/examples/jsm/": "./vendor/three/addons/",
          "postprocessing": "./vendor/postprocessing.js",
          "n8ao": "./vendor/N8AO.js",
          "ez-tree": "./vendor/ez-tree.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <main id="stage">
        <div id="viewport"></div>
        <div id="loader"><div class="loader-inner"><div class="loader-title">Загружаем сцену</div><div class="loader-bar"><i></i></div></div></div>
        <header class="stage-head">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 40 40"><path d="M9 31V12l13 19V12M18 31 31 12v19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="miter"/><path d="M14 6l12 9M26 6 14 15" stroke="currentColor" stroke-width="1.1"/></svg>
            </span>
            <span>
              <b>DOMINNO</b>
              <small>префаб-дома · Екатеринбург</small>
            </span>
          </div>
          <nav class="models" id="models"></nav>
        </header>
        <div class="stage-foot">
          <div class="seg" id="views"></div>
          <div class="seg" id="tod"></div>
          <div class="seg">
            <button id="shot" title="Сохранить изображение">
              <svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
              <span>Снимок</span>
            </button>
          </div>
        </div>
        <div class="hint" id="hint">Вращайте — левая кнопка мыши, приближайте — колесо</div>
      </main>
      <aside id="panel">
        <div class="panel-scroll">
          <section class="project" id="project"></section>
          <div id="options"></div>
        </div>
        <footer class="summary" id="summary"></footer>
      </aside>
    </div>
    <dialog id="request">
      <form method="dialog" class="req">
        <h3>Ваш расчёт</h3>
        <div id="req-body"></div>
        <div class="req-actions">
          <button value="copy" id="req-copy" class="btn ghost">Скопировать расчёт</button>
          <a id="req-link" class="btn primary" target="_blank" rel="noopener">Проект на dominno.ru</a>
        </div>
        <button class="req-close" value="close" aria-label="Закрыть">×</button>
      </form>
    </dialog>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
